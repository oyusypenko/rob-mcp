name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Install pinned Codex
        if: github.event_name != 'schedule'
        run: npm install --global @openai/codex@0.144.6
      - name: Install latest Codex for scheduled compatibility probe
        if: github.event_name == 'schedule'
        run: npm install --global @openai/codex@latest
      - name: Validate pinned behavior
        if: github.event_name != 'schedule'
        run: bun run validate
      - name: Probe latest Codex behavior
        if: github.event_name == 'schedule'
        env:
          CODEX_PARITY_ALLOW_VERSION_DRIFT: "1"
        run: bun run validate
