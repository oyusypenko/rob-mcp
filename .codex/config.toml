# GENERATED by scripts/sync-codex.ts from .mcp.json + .claude/settings.json — DO NOT EDIT.
# Regenerate with `bun run sync-codex`; `bun run validate` fails on drift.
# Project-scoped config loads only when this project is trusted by Codex.

# Hooks live in .codex/hooks.json (same scripts as .claude/hooks/). They require one-time
# trust approval via `/hooks` in the TUI, or --dangerously-bypass-hook-trust in CI.

default_permissions = "rob-mcp"

[permissions.rob-mcp]
description = "Generated from .claude/settings.json: workspace editing with secret paths denied."
extends = ":workspace"

[permissions.rob-mcp.filesystem]
glob_scan_max_depth = 8

[permissions.rob-mcp.filesystem.":workspace_roots"]
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/keystore/**" = "deny"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
required = false
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }
